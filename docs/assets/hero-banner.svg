<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background & Depth -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090A0F" />
      <stop offset="50%" stop-color="#0E1017" />
      <stop offset="100%" stop-color="#090A0F" />
    </linearGradient>

    <!-- Subtle Emerald Glow (Minimal, Non-Gaudy) -->
    <radialGradient id="radialAccent" cx="15%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.10" />
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.0" />
    </radialGradient>
    <radialGradient id="cardGlow" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0E1017" stop-opacity="0.0" />
    </radialGradient>

    <!-- Refined Linear Accents -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="emeraldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Fine Architectural Grid -->
    <pattern id="fineGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E2330" stroke-width="0.65" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <!-- Canvas Surface -->
  <rect width="1200" height="360" rx="16" fill="url(#bgCanvas)" stroke="#1A1F2C" stroke-width="1.5" />
  <rect width="1200" height="360" rx="16" fill="url(#fineGrid)" />
  <rect width="1200" height="360" rx="16" fill="url(#radialAccent)" />

  <!-- Top Ambient Hairline -->
  <line x1="80" y1="1" x2="1120" y2="1" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Geometric Shield & Radar Emblem -->
  <g transform="translate(76, 68)">
    <!-- Concentric Technical Radar Rings -->
    <circle cx="90" cy="90" r="82" fill="none" stroke="#1E2433" stroke-width="1.2" stroke-dasharray="3 4" />
    <circle cx="90" cy="90" r="62" fill="none" stroke="#1A202C" stroke-width="1" />
    <circle cx="90" cy="90" r="38" fill="#10B981" fill-opacity="0.04" stroke="#10B981" stroke-width="0.75" stroke-opacity="0.3" />

    <!-- Modern Hex-Shield Contour -->
    <path d="M90 24 L144 48 V100 C144 134 120 162 90 172 C60 162 36 134 36 100 V48 Z"
          fill="#0B0D14" fill-opacity="0.85" stroke="url(#emeraldStroke)" stroke-width="2.2" stroke-linejoin="round" />

    <!-- Inner Core Glyph (Clean Geometry) -->
    <path d="M90 52 L122 68 V98 C122 120 108 140 90 148 C72 140 58 120 58 98 V68 Z"
          fill="none" stroke="#2DD4BF" stroke-width="1.2" stroke-opacity="0.35" />

    <!-- Pulse Signal Centerpiece -->
    <path d="M68 96 H80 L86 82 L94 110 L100 96 H112"
          fill="none" stroke="#34D399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Core Status Beacon -->
    <circle cx="90" cy="62" r="3" fill="#34D399" />
  </g>

  <!-- Typography & Information Layer -->
  <g transform="translate(288, 76)">
    <!-- Version & Reliability Pill -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="310" height="26" rx="13" fill="#111520" stroke="#1E2638" stroke-width="1" />
      <circle cx="14" cy="13" r="3.5" fill="#10B981" />
      <text x="26" y="17" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.8">
        v1.1.1 <tspan fill="#475569">•</tspan> HIGH-VELOCITY DAST <tspan fill="#475569">•</tspan> <tspan fill="#10B981">0 FP</tspan>
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="68" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.8">
      Armor<tspan fill="#34D399">Scan</tspan>
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="2" y="104" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="16.5" font-weight="400" letter-spacing="-0.2">
      Next-generation, non-destructive application security testing for modern stacks.
    </text>

    <!-- Four High-Density Metric Cards (Clean, Cohesive, Minimal) -->
    <g transform="translate(0, 134)">
      <!-- Metric 1: Velocity -->
      <g transform="translate(0, 0)">
        <rect width="186" height="66" rx="8" fill="#0D1017" stroke="#1A202E" stroke-width="1" />
        <rect width="186" height="66" rx="8" fill="url(#cardGlow)" />
        <text x="16" y="28" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">&lt; 8.5s</text>
        <text x="16" y="48" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="0.6">SCAN VELOCITY</text>
      </g>

      <!-- Metric 2: Precision -->
      <g transform="translate(198, 0)">
        <rect width="186" height="66" rx="8" fill="#0D1017" stroke="#1A202E" stroke-width="1" />
        <rect width="186" height="66" rx="8" fill="url(#cardGlow)" />
        <text x="16" y="28" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">100.0%</text>
        <text x="16" y="48" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="0.6">PRECISION (0 FP)</text>
      </g>

      <!-- Metric 3: Juice Shop Recall -->
      <g transform="translate(396, 0)">
        <rect width="198" height="66" rx="8" fill="#0D1017" stroke="#1A202E" stroke-width="1" />
        <rect width="198" height="66" rx="8" fill="url(#cardGlow)" />
        <text x="16" y="28" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">83.3% <tspan fill="#64748B" font-size="14">(15/18)</tspan></text>
        <text x="16" y="48" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="0.6">JUICE SHOP RECALL</text>
      </g>

      <!-- Metric 4: Engine Index -->
      <g transform="translate(606, 0)">
        <rect width="216" height="66" rx="8" fill="#0D1017" stroke="#1A202E" stroke-width="1" />
        <rect width="216" height="66" rx="8" fill="url(#cardGlow)" />
        <text x="16" y="28" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">100 / 100 <tspan fill="#34D399" font-size="15">[A+]</tspan></text>
        <text x="16" y="48" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="0.6">APEX ENGINE INDEX</text>
      </g>
    </g>
  </g>
</svg>
