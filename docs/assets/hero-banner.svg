<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.05" />
    </linearGradient>
    <radialGradient id="glow1" cx="25%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.65" />
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="18" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />
  <rect width="1200" height="380" rx="18" fill="url(#grid)" />
  <rect width="1200" height="380" rx="18" fill="url(#glow1)" />
  <rect width="1200" height="380" rx="18" fill="url(#glow2)" />

  <!-- Top & Bottom Accent Lines -->
  <rect x="100" y="0" width="1000" height="2" fill="url(#accentGrad)" opacity="0.85" />
  <rect x="250" y="378" width="700" height="2" fill="url(#accentGrad)" opacity="0.45" />

  <!-- Left Shield Emblem -->
  <g transform="translate(85, 78)">
    <!-- Outer hexagon / radar ring -->
    <circle cx="110" cy="110" r="96" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6 6" />
    <circle cx="110" cy="110" r="78" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.3" />
    <!-- Shield Polygon -->
    <path d="M110 28 L176 54 V112 C176 158 147 194 110 210 C73 194 44 158 44 112 V54 Z"
          fill="url(#shieldGrad)" stroke="url(#accentGrad)" stroke-width="3" filter="url(#softGlow)" />
    <!-- Inner Shield Pulse Line -->
    <path d="M74 116 L96 116 L105 92 L117 138 L127 108 L136 116 L148 116"
          fill="none" stroke="#10B981" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Lock / Core Dot -->
    <circle cx="110" cy="68" r="4" fill="#06B6D4" />
  </g>

  <!-- Main Typography -->
  <g transform="translate(320, 108)">
    <!-- Pill Tag -->
    <rect x="0" y="-36" width="375" height="28" rx="14" fill="#0F172A" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="16" cy="-22" r="4.5" fill="#10B981" />
    <text x="30" y="-17" fill="#A7F3D0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.2">
      v0.6.0 NEXT-GEN DEVSECOPS &amp; SENTINEL
    </text>

    <!-- Title -->
    <text x="0" y="38" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
      Armor<tspan fill="url(#accentGrad)">Scan</tspan>
    </text>

    <!-- Subtitle -->
    <text x="2" y="76" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, sans-serif" font-size="19.5" font-weight="400">
      Next-Generation Non-Destructive DAST &amp; Autonomous DevSecOps Sentinel
    </text>

    <!-- Feature Metric Pills -->
    <g transform="translate(0, 108)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="185" height="68" rx="10" fill="#0B1120" fill-opacity="0.85" stroke="#1E293B" stroke-width="1.5" />
      <text x="18" y="28" fill="#10B981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700">100.0%</text>
      <text x="18" y="50" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.5">PRECISION (0 FP)</text>

      <!-- Card 2 -->
      <rect x="200" y="0" width="195" height="68" rx="10" fill="#0B1120" fill-opacity="0.85" stroke="#1E293B" stroke-width="1.5" />
      <text x="218" y="28" fill="#06B6D4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700">83.3% (15/18)</text>
      <text x="218" y="50" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.5">JUICE SHOP RECALL</text>

      <!-- Card 3 -->
      <rect x="410" y="0" width="185" height="68" rx="10" fill="#0B1120" fill-opacity="0.85" stroke="#1E293B" stroke-width="1.5" />
      <text x="428" y="28" fill="#A855F7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700">29+ RULES</text>
      <text x="428" y="50" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.5">YAML TEMPLATE LIB</text>

      <!-- Card 4 -->
      <rect x="610" y="0" width="195" height="68" rx="10" fill="#0B1120" fill-opacity="0.85" stroke="#1E293B" stroke-width="1.5" />
      <text x="628" y="28" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700">SARIF 2.1.0</text>
      <text x="628" y="50" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.5">GITHUB SECURITY TAB</text>
    </g>
  </g>
</svg>
