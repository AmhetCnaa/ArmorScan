<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgChart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090A0F" />
      <stop offset="100%" stop-color="#0E1017" />
    </linearGradient>

    <linearGradient id="barMuted" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#3F3F46" />
    </linearGradient>

    <linearGradient id="barMid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="barEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1140" height="320" rx="12" fill="url(#bgChart)" stroke="#1A1F2C" stroke-width="1.5" />

  <!-- Header Block -->
  <g transform="translate(36, 32)">
    <text x="0" y="20" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="700" letter-spacing="-0.3">
      OWASP Juice Shop Benchmark Progression
    </text>
    <text x="0" y="40" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5">
      Evaluated against the 18 Automated Non-Destructive DAST Categories • Strict 0 False Positive Policy
    </text>

    <!-- Top Right Precision Pill -->
    <g transform="translate(830, -4)">
      <rect width="238" height="38" rx="6" fill="#0D131C" stroke="#1E2738" stroke-width="1" />
      <circle cx="16" cy="19" r="3.5" fill="#10B981" />
      <text x="28" y="23" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">
        100.0% PRECISION <tspan fill="#64748B">•</tspan> 0 FP
      </text>
    </g>
  </g>

  <!-- Row 1: v0.4.0 Baseline -->
  <g transform="translate(36, 110)">
    <text x="0" y="20" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">v0.4.0 Baseline</text>
    <text x="0" y="38" fill="#52525B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">Surface Headers + Rate Limits</text>

    <!-- Progress Track & Fill -->
    <rect x="220" y="6" width="700" height="28" rx="6" fill="#0D1017" stroke="#1A202C" stroke-width="1" />
    <rect x="220" y="6" width="117" height="28" rx="6" fill="url(#barMuted)" />
    <text x="936" y="25" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600">
      16.7% <tspan fill="#52525B" font-size="12">(3/18 TP)</tspan>
    </text>
  </g>

  <!-- Row 2: v0.4.1 Deep Logic -->
  <g transform="translate(36, 175)">
    <text x="0" y="20" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">v0.4.1 Logic Engine</text>
    <text x="0" y="38" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">+ JS Crawler, Auth, IDOR, DOM, SQLi</text>

    <!-- Progress Track & Fill -->
    <rect x="220" y="6" width="700" height="28" rx="6" fill="#0D1017" stroke="#1A202C" stroke-width="1" />
    <rect x="220" y="6" width="350" height="28" rx="6" fill="url(#barMid)" />
    <text x="936" y="25" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600">
      50.0% <tspan fill="#64748B" font-size="12">(9/18 TP)</tspan>
    </text>
  </g>

  <!-- Row 3: v1.1.1 Apex Engine -->
  <g transform="translate(36, 240)">
    <text x="0" y="20" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">v1.1.1 Apex Engine</text>
    <text x="0" y="38" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">+ Deep Spider, Turbo Fast-Probe, Protocol Resilience</text>

    <!-- Progress Track & Fill -->
    <rect x="220" y="6" width="700" height="28" rx="6" fill="#0D1017" stroke="#1A202C" stroke-width="1" />
    <rect x="220" y="6" width="583" height="28" rx="6" fill="url(#barEmerald)" />
    <text x="936" y="25" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="700">
      83.3% <tspan fill="#64748B" font-size="12">(15/18 TP)</tspan>
    </text>
  </g>
</svg>
