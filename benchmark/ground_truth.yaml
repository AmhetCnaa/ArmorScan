description: "ArmorScan Controlled Benchmark Ground Truth Dataset"
version: "1.0.0"
endpoints:
  - id: "reflection_vulnerable"
    path: "/vuln/reflect?q=test"
    module: "reflection"
    type: "vulnerable"
    expected_findings:
      - "SCRIPT_CONTEXT_INPUT_REFLECTION"
      - "UNENCODED_HTML_INPUT_REFLECTION"
    forbidden_findings: []

  - id: "reflection_safe"
    path: "/safe/reflect?q=test"
    module: "reflection"
    type: "safe"
    expected_findings: []
    forbidden_findings:
      - "SCRIPT_CONTEXT_INPUT_REFLECTION"
      - "UNENCODED_HTML_INPUT_REFLECTION"
      - "ATTRIBUTE_CONTEXT_INPUT_REFLECTION"

  - id: "redirect_vulnerable"
    path: "/vuln/redirect?next=/dashboard"
    module: "redirect"
    type: "vulnerable"
    expected_findings:
      - "OPEN_REDIRECT_UNVALIDATED"
    forbidden_findings: []

  - id: "redirect_safe"
    path: "/safe/redirect?next=/dashboard"
