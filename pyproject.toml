[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "armorscan"
version = "1.1.0"
description = "Modern, fast, developer-friendly DAST & Security Scanner CLI for localhost and production web targets."
readme = "README.md"
authors = [
    { name = "ArmorScan Team", email = "security@armorscan.dev" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["security", "dast", "devsecops", "scanner", "owasp", "headers", "rate-limit", "cors"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "httpx[http2]>=0.28.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pyyaml>=6.0.0",
]
benchmark = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pyyaml>=6.0.0",
]
browser = [
    "playwright>=1.40.0",
]

[project.scripts]
armorscan = "armorscan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["armorscan"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
